version: 2
updates:
  - package-ecosystem: "terraform"
    directory: "/aws/"
    schedule:
      interval: "weekly"
    target-branch: "alpha"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated pr"
  - package-ecosystem: "npm"
    directory: "/"
    labels:
      - "dependencies"
      - "javascript"
      - "automated pr"
    schedule:
      interval: "weekly"
    target-branch: "alpha"
  - package-ecosystem: "github-actions"
    directory: "/.github"
    labels:
      - "dependencies"
      - "automated pr"
    schedule:
      interval: "weekly"
    target-branch: "alpha"
