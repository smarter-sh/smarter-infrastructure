# Install with `make pre-commit-init`, which installs both the pre-commit and
# the commit-msg hooks (see default_install_hook_types).
default_install_hook_types: [pre-commit, commit-msg]

# Terraform and Terragrunt caches are git-ignored, but keep them out of every hook
# in case one is ever staged.
exclude: '(^|/)\.(terraform|terragrunt-cache)/'

repos:
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        args: ["--ignore-words=codespell.txt"]
        files: "^aws/"
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # See https://pre-commit.com/hooks.html for more hooks
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: destroyed-symlinks
      - id: detect-aws-credentials
        args: ["--allow-missing-credentials"]
      - id: detect-private-key
      - id: end-of-file-fixer
        files: "^aws/"
      - id: fix-byte-order-marker
      - id: forbid-new-submodules
      - id: trailing-whitespace
        files: "^aws/"
  - repo: https://github.com/gruntwork-io/pre-commit
    rev: v0.1.30 # Get the latest from: https://github.com/gruntwork-io/pre-commit/releases
    hooks:
      - id: terraform-fmt
        files: '^aws/.*\.tf$'
      # runs terraform init -backend=false, so it never reads or writes remote state
      - id: terraform-validate
        files: '^aws/.*\.tf$'
      # - id: tflint    # requires too much extra installation in GitHub Actions.
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional", "@commitlint/config-angular"]
ci:
  # for more information, see https://pre-commit.ci
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks
  autofix_prs: true
  autoupdate_branch: ""
  autoupdate_commit_msg: "[pre-commit.ci] pre-commit autoupdate"
  autoupdate_schedule: quarterly
  skip: [terraform-fmt, terraform-validate, commitlint]
  submodules: false
